name: Deploy Swiss Cluster

on:
  push:
    branches: [dev]
    paths:
      - 'docker-compose.ch.yml'
      - 'ch/**'
      - '.github/workflows/deploy-ch.yml'

jobs:
  test-build-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build all services (CH)
      run: docker compose -f docker-compose.ch.yml build

    - name: Run backend linter in container
      run: docker compose -f docker-compose.ch.yml run --rm api_ia_ch pylint /app || true

    - name: Run backend tests in container
      run: docker compose -f docker-compose.ch.yml run --rm api_ia_ch pytest /app/tests

    - name: Run frontend tests in container
      run: docker compose -f docker-compose.ch.yml run --rm front_ch front_ch_test

    - name: Deploy via SSH
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USER }}
        key: ${{ secrets.SSH_KEY }}
        script: |
          cd /home/enzo/Dev/MSPR-TPRE-601-604/MSPR-TPRE-601
          git pull origin dev
          docker compose -f docker-compose.ch.yml pull
          docker compose -f docker-compose.ch.yml down
          docker compose -f docker-compose.ch.yml up -d --build
