name: Deploy France Cluster

on:
  push:
    branches: [dev]
    paths:
      - 'docker-compose.fr.yml'
      - 'fr/**'
      - '.github/workflows/deploy-fr.yml'

jobs:
  test-build-deploy:
    runs-on: ubuntu-latest
    environment: "MSPR 601"

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build all services (FR)
      run: docker compose -f docker-compose.fr.yml build

    - name: Run backend linter in container
      run: docker compose -f docker-compose.fr.yml run --rm api_ia_fr pylint /app || true

    - name: Run backend tests in container
      run: docker compose -f docker-compose.fr.yml run --rm api_ia_fr pytest /app/tests

    - name: Run frontend tests in container
      run: docker compose -f docker-compose.fr.yml run --rm front_fr front_fr_test

    - name: Deploy via SSH
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USER }}
        key: ${{ secrets.SSH_KEY }}
        script: |
          cd /home/enzo/Dev/MSPR-TPRE-601-604/MSPR-TPRE-601
          git pull origin dev
          docker compose -f docker-compose.fr.yml pull
          docker compose -f docker-compose.fr.yml down
          docker compose -f docker-compose.fr.yml up -d --build
